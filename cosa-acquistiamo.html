<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cosa acquistiamo | Italian Vintage Deco – MS</title>

<style>
* {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
}

:root {
   --burgundy: #671c22;
   --burgundy-dark: #491317;
   --gold: #9a793c;
   --gold-light: #b79a63;
   --ivory: #f7f3e9;
   --cream: #eee7d7;
   --text: #3f3030;
}

body {
   background: var(--ivory);
   color: var(--text);
   font-family: Georgia, "Times New Roman", serif;
   line-height: 1.45;
}

/* =========================
  HEADER
========================= */

header {
   background: #f8f5ed;
   border-bottom: 1px solid rgba(154,121,60,.28);
}

.header-inner {
   max-width: 1380px;
   margin: auto;
   min-height: 96px;
   padding: 15px 34px;
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 30px;
}

.brand {
   display: flex;
   align-items: center;
   gap: 13px;
   text-decoration: none;
   color: var(--burgundy);
   flex-shrink: 0;
}

.brand-mark {
   width: 32px;
   height: 42px;
   display: flex;
   align-items: center;
   justify-content: center;
}

.brand-mark svg {
   width: 29px;
   height: 39px;
   fill: var(--gold);
}

.brand-text strong {
   display: block;
   color: var(--burgundy);
   font-size: 18px;
   font-weight: normal;
   letter-spacing: 1.5px;
   white-space: nowrap;
}

.brand-text span {
   display: block;
   margin-top: 5px;
   color: #7a6a58;
   font-size: 9px;
   letter-spacing: 1.65px;
   text-transform: uppercase;
}

nav {
   display: flex;
   align-items: center;
   justify-content: flex-end;
   gap: 25px;
}

nav a {
   position: relative;
   padding: 12px 0;
   color: #4d4140;
   text-decoration: none;
   text-transform: uppercase;
   font-size: 11px;
   letter-spacing: 1.15px;
   white-space: nowrap;
}

nav a:hover {
   color: var(--burgundy);
}

nav a.active {
   color: var(--burgundy);
}

nav a.active::after {
   content: "";
   position: absolute;
   left: 50%;
   bottom: 4px;
   width: 38px;
   height: 1px;
   background: var(--gold);
   transform: translateX(-50%);
}

/* =========================
  PAGE INTRO
========================= */

.page-intro {
   text-align: center;
   padding: 34px 20px 28px;
}

.ornament {
   display: flex;
   justify-content: center;
   margin-bottom: 7px;
}

.ornament svg {
   width: 20px;
   height: 25px;
   fill: var(--gold);
}

.page-intro h1 {
   color: var(--burgundy);
   font-size: clamp(27px, 3vw, 39px);
   font-weight: normal;
   letter-spacing: 2.6px;
   line-height: 1.1;
}

.title-line {
   width: 74px;
   height: 1px;
   background: var(--gold);
   margin: 13px auto 12px;
}

.page-intro p {
   color: #675b55;
   font-size: 14px;
   letter-spacing: .35px;
}

/* =========================
  CATEGORY GRID
========================= */

.categories {
   max-width: 1280px;
   margin: 0 auto;
   padding: 0 28px 34px;
}

.category-grid {
   display: grid;
   grid-template-columns: repeat(3, 1fr);
   gap: 12px;
}

.category {
   display: grid;
   grid-template-columns: 1fr 1fr;
   height: 220px;
   overflow: hidden;
   border: 1px solid rgba(154,121,60,.25);
   background: #eee7d7;
}

.category-image {
   height: 100%;
   overflow: hidden;
   background:
       linear-gradient(
           135deg,
           #e9e1d1,
           #f4efe5
       );
}

.category-image img {
   display: block;
   width: 100%;
   height: 100%;
   object-fit: cover;
}

.category-content {
   height: 100%;
   padding: 18px 17px;
   background: #f0e9da;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   text-align: center;
}

.category-icon {
   height: 22px;
   margin-bottom: 7px;
}

.category-icon svg {
   width: 18px;
   height: 22px;
   fill: var(--gold);
}

.category-content h2 {
   color: var(--burgundy);
   font-size: 16px;
   line-height: 1.22;
   font-weight: normal;
   letter-spacing: .45px;
   margin-bottom: 8px;
}

.category-content p {
   max-width: 190px;
   color: #61544e;
   font-size: 11.5px;
   line-height: 1.45;
}

/* alternate cards */

.category:nth-child(even) .category-image {
   order: 2;
}

.category:nth-child(even) .category-content {
   order: 1;
}

/* final wide category */

.category.last {
   grid-column: 1 / 2;
}

/* =========================
  COLLECTIONS CALLOUT
========================= */

.collections-callout {
   background: #ebe2d0;
   border-top: 1px solid rgba(154,121,60,.22);
   border-bottom: 1px solid rgba(154,121,60,.22);
}

.collections-inner {
   max-width: 1050px;
   margin: auto;
   padding: 22px 25px;
   text-align: center;
}

.collections-inner p {
   color: #594a43;
   font-size: 14px;
   line-height: 1.55;
}

.collections-inner a {
   display: inline-block;
   margin-top: 5px;
   color: var(--burgundy);
   text-decoration: none;
   font-size: 12px;
   letter-spacing: .8px;
   text-transform: uppercase;
   border-bottom: 1px solid var(--gold);
   padding-bottom: 2px;
}

/* =========================
  VALUATION
========================= */

.valuation {
   text-align: center;
   padding: 27px 20px 24px;
}

.valuation h2 {
   color: var(--burgundy);
   font-size: 17px;
   font-weight: normal;
   letter-spacing: 1.5px;
   text-transform: uppercase;
}

.valuation p {
   margin-top: 7px;
   color: #665953;
   font-size: 13px;
}

/* =========================
  WHATSAPP
========================= */

.whatsapp-wrap {
   padding: 0 20px 27px;
}

.whatsapp {
   max-width: 600px;
   margin: auto;
   padding: 17px 22px;
   text-align: center;
   border: 1px solid #798b68;
   background: #edf0e5;
}

.whatsapp-title {
   display: flex;
   justify-content: center;
   align-items: center;
   gap: 9px;
   color: #465b3e;
   font-size: 13px;
   letter-spacing: 1px;
}

.whatsapp-title svg {
   width: 19px;
   height: 19px;
   fill: #536b49;
}

.whatsapp-number {
   display: block;
   margin-top: 5px;
   color: var(--burgundy);
   font-size: 18px;
   letter-spacing: 1px;
}

.whatsapp-link {
   display: inline-block;
   margin-top: 4px;
   color: #536b49;
   font-size: 10px;
   letter-spacing: 1.3px;
   text-decoration: none;
   text-transform: uppercase;
}

/* =========================
  BENEFITS
========================= */

.benefits {
   border-top: 1px solid rgba(154,121,60,.25);
   background: #f2ecdf;
}

.benefits-inner {
   max-width: 1160px;
   margin: auto;
   padding: 23px 25px 22px;
   display: grid;
   grid-template-columns: repeat(4, 1fr);
}

.benefit {
   min-height: 76px;
   padding: 3px 20px;
   text-align: center;
   border-right: 1px solid rgba(154,121,60,.27);
}

.benefit:last-child {
   border-right: none;
}

.benefit svg {
   width: 25px;
   height: 25px;
   margin-bottom: 7px;
   stroke: var(--gold);
   fill: none;
   stroke-width: 1.45;
   stroke-linecap: round;
   stroke-linejoin: round;
}

.benefit h3 {
   color: var(--burgundy);
   font-size: 10.5px;
   line-height: 1.45;
   font-weight: normal;
   letter-spacing: .9px;
   text-transform: uppercase;
}

/* =========================
  FOOTER
========================= */

footer {
   background: var(--burgundy-dark);
   color: #e9dfcf;
   text-align: center;
   padding: 15px 20px;
   font-size: 10px;
   letter-spacing: .7px;
}

/* =========================
  MOBILE
========================= */

@media (max-width: 1050px) {
   .header-inner {
       flex-direction: column;
       min-height: auto;
       padding: 16px 20px 10px;
   }

   nav {
       justify-content: center;
       flex-wrap: wrap;
       gap: 7px 18px;
   }

   .category-grid {
       grid-template-columns: repeat(2, 1fr);
   }

   .category.last {
       grid-column: auto;
   }
}

@media (max-width: 720px) {
   .brand-text strong {
       font-size: 15px;
       white-space: normal;
   }

   .brand-text span {
       font-size: 8px;
   }

   nav {
       gap: 3px 13px;
   }

   nav a {
       font-size: 9px;
   }

   .page-intro {
       padding: 26px 18px 22px;
   }

   .page-intro h1 {
       font-size: 28px;
       letter-spacing: 1.7px;
   }

   .page-intro p {
       font-size: 12px;
   }

   .categories {
       padding: 0 14px 25px;
   }

   .category-grid {
       grid-template-columns: 1fr;
       gap: 10px;
   }

   .category {
       height: 205px;
   }

   .category-content {
       padding: 13px;
   }

   .category-content h2 {
       font-size: 15px;
   }

   .category-content p {
       font-size: 10.5px;
   }

   .benefits-inner {
       grid-template-columns: repeat(2, 1fr);
       gap: 18px 0;
   }

   .benefit:nth-child(2) {
       border-right: none;
   }
}

@media (max-width: 430px) {
